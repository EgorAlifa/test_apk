<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .apk-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .apk-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .apk-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        
        .apk-icon {
            font-size: 32px;
            flex-shrink: 0;
        }
        
        .apk-info {
            flex: 1;
            min-width: 0;
        }
        
        .apk-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
            word-break: break-word;
        }
        
        .apk-size {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .download-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .download-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 APK Downloader</h1>
        <p class="subtitle">Выберите приложение для скачивания</p>
        
        <div class="apk-list">
            <div class="apk-item">
                <div class="apk-icon">📺</div>
                <div class="apk-info">
                    <div class="apk-name">Rutube</div>
                    <div class="apk-size">28.8.0</div>
                </div>
                <a href="Rutube-28.8.0.apk" download class="download-btn">Скачать</a>
            </div>
            
            <div class="apk-item">
                <div class="apk-icon">🎬</div>
                <div class="apk-info">
                    <div class="apk-name">Zona</div>
                    <div class="apk-size">2.1.75</div>
                </div>
                <a href="zona_2.1.75.apk" download class="download-btn">Скачать</a>
            </div>
        </div>
    </div>
</body>
</html>
