name: Publish show

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble video.mp4 from parts
        run: |
          mkdir -p _site
          cat video.mp4.part0 video.mp4.part1 video.mp4.part2 video.mp4.part3 video.mp4.part4 > _site/video.mp4
          size=$(stat -c %s _site/video.mp4)
          echo "video.mp4 size: $size"
          test "$size" -eq 97240930
          cp index.html _site/
          cp -r games _site/
          cp apk.html *.apk _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
